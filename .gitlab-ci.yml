# 远程 CI：与 tools/engineering/verify.py 使用同一套门禁步骤。
# 验证类 job 用 tags: [docker-ci] 固定到 docker 执行器：shell 执行器同样带 docker 标签，
# 但既没有 services 也没有 JDK，被它领取就会以 exit 127/4 失败（曾在 CI 上反复出现）。
# 打包与部署 job 用 tags: [shell] 固定到 shell 执行器，因为它们要直接操作宿主机 docker。
stages:
  - verify
  - frontend
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # 暂用 tag 固定 service 镜像：本机 Runner 无法直达 Docker Hub，digest 拉取会失败。
  # 待 Runner 具备 Hub 访问后改回 digest（记录见 REV-005 验证记录）。
  TS_POSTGRES_IMAGE: "postgres:18"
  # JDK 25 是工程硬要求；镜像已自带 Maven 3.9。
  TS_JDBC_URL: "jdbc:postgresql://postgres:5432/teraschool_test"

backend:
  stage: verify
  tags: [docker-ci]
  image: maven:3.9-eclipse-temurin-25
  services:
    - name: $TS_POSTGRES_IMAGE
      alias: postgres
      # 默认 max_connections=100 会被测试套件打满（每个受限角色各建一个连接池），
      # 报 "remaining connection slots are reserved for roles with the SUPERUSER attribute"。
      command: ["-c", "max_connections=500", "-c", "superuser_reserved_connections=10"]
  variables:
    POSTGRES_DB: teraschool_test
    POSTGRES_PASSWORD: ci-postgres-admin
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  before_script:
    - |
      # maven 镜像基于 Ubuntu：换阿里云源后再装 psql（建角色用）、python3（抽取自检用）
      # 与 unzip。缺 unzip 时 Maven Wrapper 会降级去下 .tar.gz，却仍用 zip 的
      # distributionSha256Sum 校验，必然报 "Failed to validate Maven distribution SHA-256"。
      if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
        sed -i 's|http://archive.ubuntu.com|https://mirrors.aliyun.com|g; s|http://security.ubuntu.com|https://mirrors.aliyun.com|g' /etc/apt/sources.list.d/ubuntu.sources
      fi
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client python3 unzip
    - mkdir -p .m2/repository
    - |
      for i in $(seq 1 40); do
        (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && break
        sleep 1
      done
    - |
      TS_APP_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
      TS_IDENTITY_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
      TS_SESSION_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
      TS_AUDIT_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
      TS_SCHEDULER_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
      TS_PLATFORM_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
      export TS_ADMIN_PASSWORD="$POSTGRES_PASSWORD" \
        TS_APP_PASSWORD TS_IDENTITY_PASSWORD TS_SESSION_PASSWORD TS_AUDIT_PASSWORD TS_SCHEDULER_PASSWORD TS_PLATFORM_PASSWORD
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U postgres -d teraschool_test -v ON_ERROR_STOP=1 \
        -v app="$TS_APP_PASSWORD" -v identity="$TS_IDENTITY_PASSWORD" \
        -v session="$TS_SESSION_PASSWORD" -v audit="$TS_AUDIT_PASSWORD" \
        -v scheduler="$TS_SCHEDULER_PASSWORD" \
        -v platform="$TS_PLATFORM_PASSWORD" <<'SQL'
      CREATE ROLE ts_app LOGIN PASSWORD :'app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      CREATE ROLE ts_identity LOGIN PASSWORD :'identity' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      CREATE ROLE ts_session LOGIN PASSWORD :'session' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      CREATE ROLE ts_audit LOGIN PASSWORD :'audit' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      CREATE ROLE ts_scheduler LOGIN PASSWORD :'scheduler' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      CREATE ROLE ts_platform LOGIN PASSWORD :'platform' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
      SQL
  script:
    - python3 tools/migration/extract_legacy.py --self-check
    - cd backend
    # flyway 必须加 -N 只作用于根工程：不加的话 Maven 会对 14 个模块逐个执行该 goal，
    # 而 goal 不产出 jar，identity 解析 platform 依赖时就会 "Could not find artifact"。
    - ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml -N flyway:migrate
    - ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml -N jooq-codegen:generate
    - ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml spotless:check
    # ContainerRuntimeTest / PermissionMigrationTest 依赖 Testcontainers，验证的是
    # 「开发机 Docker 引擎与端口映射链路」；容器化 job 内映射端口不可达，必然失败。
    # 这两项由 tools/engineering/verify.py 在具备 Docker 的开发机上覆盖，CI 显式排除。
    - ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml verify -Dtest='!ContainerRuntimeTest,!PermissionMigrationTest' -Dsurefire.failIfNoSpecifiedTests=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/**/target/surefire-reports/
      - backend/applications/server/target/openapi.json

documentation:
  stage: verify
  tags: [docker-ci]
  image: python:3.13
  script:
    - python -m pip install -r tools/progress/requirements.txt
    - python -X utf8 tools/progress/build.py --check

frontend:
  stage: frontend
  tags: [docker-ci]
  image: node:24
  needs:
    - job: backend
      artifacts: true
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store
  before_script:
    - cd frontend
    - corepack enable
    - pnpm config set store-dir ../.pnpm-store
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm run generate
    - pnpm run typecheck
    - pnpm run lint
    - pnpm run format:check
    - pnpm run test
    - pnpm run build

# ===== 测试环境：打包与部署（页面上两个手动按钮）=====
# 都跑在 shell 执行器上：它就在这台服务器上，直接使用宿主机 docker，
# 所以开发期不推送镜像仓库——镜像只留在本机。
#
# 点「打包镜像」→ 构建 jar/openapi/dist 并打出两个镜像；
# 点「部署测试环境」→ 起服务并执行迁移。数据在命名卷里，重复部署不丢。
package:images:
  stage: package
  tags: [shell]
  when: manual
  # 不等待任何前置阶段：验证失败不应阻塞「打包」，否则按钮会变成 skipped 点不了。
  needs: []
  timeout: 1h
  script:
    - export TS_PROJECT_NAME="$(grep -m1 '^TS_PROJECT_NAME=' /www/teraschool/test/.env | cut -d= -f2)"
    # 定义了 ACR_* 变量时 build-images.sh 会额外推送到镜像仓库；否则只用本地镜像。
    - export TS_IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - bash deploy/build-images.sh

deploy:test:
  stage: deploy
  tags: [shell]
  when: manual
  # 同样不依赖前置阶段：部署的是「当前已有的镜像」。
  # 先点打包再点部署是使用约定，不靠流水线强绑，避免任一阶段失败后按钮不可用。
  needs: []
  timeout: 30m
  script:
    # 与打包 job 用同一个 tag；ACR_* 变量存在时走仓库拉取，否则用本地镜像。
    - export TS_IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - bash deploy/test-deploy.sh

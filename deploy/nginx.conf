# 最小入口：静态站点 + 反向代理。
# 本文件只服务本地冒烟与内网试用；HTTPS、证书轮换与正式域名见
# doc/02-架构设计/部署交付/入口与HTTPS方案.md，未在此处假装已配置。
#
# 注意 add_header 的继承规则：只要某个 location 里出现 add_header，
# server 级的 add_header 就不再继承。因此这里所有缓存策略都用 expires，
# 不写 location 级 add_header，安全头才能对所有路径生效。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限与后端 multipart 配置保持一致（5MB 文件 / 6MB 请求）。
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 前端为单页应用，未知路径回落到 index.html，避免刷新 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 哈希命名的静态资源可长期缓存。
    location /assets/ {
        expires 1y;
    }

    # index.html 不缓存，发布后立即生效。
    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查只暴露“进程是否活着”，不暴露任何业务或配置信息。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}

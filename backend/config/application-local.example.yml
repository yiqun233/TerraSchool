# 复制到 .local/application-local.yml，填写独立开发库配置；禁止使用旧库账号。
# 本地 HTTP 调试才关闭 secure；HTTPS 交付保持默认 true。
server:
  servlet:
    session:
      cookie:
        secure: false
teraschool:
  database:
    url: jdbc:postgresql://127.0.0.1:5432/teraschool_dev
    app:
      username: ts_app
      password: ${TS_APP_PASSWORD}
    identity:
      username: ts_identity
      password: ${TS_IDENTITY_PASSWORD}
    session:
      username: ts_session
      password: ${TS_SESSION_PASSWORD}
    audit:
      username: ts_audit
      password: ${TS_AUDIT_PASSWORD}
  # 私有对象存储，按环境通过受限文件或环境变量注入；禁止写入仓库。
  storage:
    endpoint: ${TS_STORAGE_ENDPOINT}
    region: ${TS_STORAGE_REGION}
    bucket: ${TS_STORAGE_BUCKET}
    access-key: ${TS_STORAGE_ACCESS_KEY}
    secret-key: ${TS_STORAGE_SECRET_KEY}
  # 32字节随机主密钥的Base64，必须独立保护和备份；禁止提交Git。
  mail-credentials:
    master-key: ${TS_MAIL_CREDENTIAL_MASTER_KEY}

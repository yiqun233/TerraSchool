spring:
  flyway:
    enabled: false
  application:
    name: teraschool
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: infra.SPRING_SESSION
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
springdoc:
  api-docs:
    version: OPENAPI_3_0
teraschool:
  admissions:
    auto-recycle:
      # Keep disabled until each school's legacy policy and contact definition are confirmed.
      enabled: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_ENABLED:false}
      interval-ms: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_INTERVAL_MS:60000}
      inactive-days: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_INACTIVE_DAYS:7}
      assignment-age-enabled: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_ASSIGNMENT_AGE_ENABLED:false}
      assignment-age-days: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_ASSIGNMENT_AGE_DAYS:15}
      first-day-no-contact-enabled: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_FIRST_DAY_NO_CONTACT_ENABLED:false}
      first-day-cutoff: ${TERASCHOOL_ADMISSIONS_AUTO_RECYCLE_FIRST_DAY_CUTOFF:23:59}

spring:
  application:
    name: teraschool
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: infra.SPRING_SESSION
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
springdoc:
  api-docs:
    version: OPENAPI_3_0

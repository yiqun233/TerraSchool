name: verify

# 与 tools/engineering/verify.py 同一套门禁；GitHub Actions 版（与 .gitlab-ci.yml 等价）。
# 说明：尚未在远程执行过（见 待确认问题 Q26）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/progress/requirements.txt
      - run: python -X utf8 tools/progress/build.py --check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: teraschool_test
          POSTGRES_PASSWORD: ci-postgres-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TS_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/teraschool_test
      TS_POSTGRES_IMAGE: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
      TS_ADMIN_PASSWORD: ci-postgres-admin
      TS_APP_PASSWORD: ci-app
      TS_IDENTITY_PASSWORD: ci-identity
      TS_SESSION_PASSWORD: ci-session
      TS_AUDIT_PASSWORD: ci-audit
      TS_SCHEDULER_PASSWORD: ci-scheduler
      TS_PLATFORM_PASSWORD: ci-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: create roles
        run: |
          PGPASSWORD=ci-postgres-admin psql -h 127.0.0.1 -U postgres -d teraschool_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ts_app LOGIN PASSWORD 'ci-app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE ts_identity LOGIN PASSWORD 'ci-identity' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE ts_session LOGIN PASSWORD 'ci-session' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE ts_audit LOGIN PASSWORD 'ci-audit' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE ts_scheduler LOGIN PASSWORD 'ci-scheduler' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE ts_platform LOGIN PASSWORD 'ci-platform' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SQL
      - name: migrate, generate, verify
        working-directory: backend
        run: |
          ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml -N flyway:migrate
          ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml -N jooq-codegen:generate
          ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml spotless:check
          ./mvnw -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml verify
      - name: check migration extraction
        run: python3 tools/migration/extract_legacy.py --self-check
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/applications/server/target/openapi.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend/applications/server/target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run generate
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
